<!DOCTYPE html>
<html>
<head>
<title>Shopping Cart</title>

<style>

body{
    background:#96bbd3;
    font-family:Times New Roman;
}

h1{
    text-align:center;
}

table{
    margin:auto;
    border-collapse:collapse;
}

th,td{
    border:1px solid black;
    padding:10px 20px;
    text-align:center;
}

button{
    padding:5px 10px;
}

</style>

</head>

<body>

<h1>SHOPPING CART</h1>

<table>

<tr>
<th>Book Name</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>
</tr>

<tr>
<td>Java Programming</td>
<td>₹550</td>
<td>1</td>
<td>₹550</td>
</tr>

<tr>
<td>Python Basics</td>
<td>₹450</td>
<td>2</td>
<td>₹900</td>
</tr>

<tr>
<td colspan="3"><b>Grand Total</b></td>
<td><b>₹1450</b></td>
</tr>

</table>

<br>

<center>
<button>Continue Shopping</button>
<button>Checkout</button>
</center>

</body>
</html>
