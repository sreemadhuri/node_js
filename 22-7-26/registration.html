<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: rgb(162, 191, 195);">
    <center>
        
        <h1> Registration Form</h1>
         <div>
            <form action="registration.html" method="post">
                <label for="Fullname">Full Name: </label>
                <input type="text" id="Fullname" name="Fullname" required><br><br>
                <label for "password">Password:</label>
                <input type="password" name="password" id="password" required><br><br>
                <label for="Email">Email: </label>
                <input type="email"><br><br>
                <label for="mobile number">mobile number: </label>
                <input type="tel"><br><br>
                <label for="age">Age: </label>
                <input type="number"><br><br>
                <label for="date of birth">Date Of Birth: </label>
                <input type="date"><br><br>
                <label for="gender">gender: </label>
                <label for="male">male:</label>
                <input type="radio" id="male" name="gender">
                <label for="female">female:</label>
                <input type="radio" id="female" name="gender"><br><br>
                <label for="hobbies">hobbies: </label>
                <input type="checkbox">
                <select name="hobbies" id="hobbies">
                    <option value="swimming">swimming</option>
                    <option value="dancing">dancing</option>
                    <option value="reading">reading</option>
                    <option value="singing">singing</option>
                </select><br><br>
                <label for="country">country: </label>
                <input type="checkbox">
                <select name="country" id="country">
                    <option value="india">india</option>
                    <option value="usa">usa</option>
                    <option value="canada">canada</option>
                    <option value="singapore">singapore</option>
                    <option value="japan">japan</option>
                    <option value="korea">korea</option>
                    <option value="china">china</option>
                    <option value="sweden">sweden</option>
                    <option value="germany">germany</option>
                </select><br><br>
                <label for="address">address: </label>
                <input type="checkbox">
                <textarea name="address" id="address"></textarea><br><br>
                <label for="favorite color">favorite color: </label>
                <input type="color"><br><br>
                <label for="website">website: </label>
                <input type="url"><br><br>
                <label for="search">search: </label>
                <input type="search"><br><br>
                <label for="upload photo">upload photo: </label>
                <input type="file"><br><br>
                <label for="registration time">registration time: </label>
                <input type="time"><br><br>
                <label for="month">month: </label>
                <input type="month"><br><br>
                <label for="week">week: </label>
                <input type="week"><br><br>
                <label for="experience range">experience range: </label>
                <input type="range"><br><br>
                <label for="hidden field">hidden field: </label>
                <input type="hidden"><br><br>
                <label for="submit button">submit button: </label>
                <input type="submit"><br><br>

                

                </center>
    
</body>
</html>
